<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; }
  canvas { display: block; }
  #panel {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); color: #ccc; padding: 12px 16px;
    font: 13px/1.6 monospace; border-radius: 6px; user-select: none;
  }
  #panel button {
    background: #333; color: #ccc; border: 1px solid #555; padding: 4px 12px;
    font: 13px monospace; border-radius: 3px; cursor: pointer; margin-right: 4px;
  }
  #panel button.active { background: #0066cc; border-color: #0088ff; color: #fff; }
  #panel button:hover { background: #444; }
  #panel button.active:hover { background: #0077dd; }
  #panel label { display: block; margin-top: 8px; cursor: pointer; }
  #info { margin-top: 8px; color: #888; }
</style></head>
<body>
<div id="panel">
  <button id="btn-walk">Walk</button>
  <button id="btn-run">Run</button>
  <button id="btn-stop">Stop</button>
  <label><input type="checkbox" id="chk-skeleton" checked> Skeleton</label>
  <div id="info">Loading...</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { SkeletonHelper } from 'three'

const params = new URLSearchParams(location.search)
const modelUrl = params.get('model')
if (!modelUrl) { document.getElementById('info').textContent = 'No ?model= param'; throw new Error('no model') }

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setClearColor(0x1a1a1a)
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true

scene.add(new THREE.AmbientLight(0xffffff, 0.6))
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8)
dirLight.position.set(0.3, 1, 0.5)
scene.add(dirLight)

const grid = new THREE.GridHelper(10, 20, 0x333333, 0x222222)
scene.add(grid)

const loader = new GLTFLoader()
const clock = new THREE.Clock()

let mixer = null
let actions = {}
let skeletonHelper = null
let currentAction = null

function setActive(name) {
  const btn = { walk: 'btn-walk', run: 'btn-run', stop: 'btn-stop' }
  for (const [k, id] of Object.entries(btn)) {
    document.getElementById(id).classList.toggle('active', k === name)
  }
}

function play(name) {
  if (currentAction) currentAction.fadeOut(0.2)
  const action = actions[name]
  if (action) {
    action.reset().fadeIn(0.2).play()
    currentAction = action
    setActive(name)
  }
}

function stop() {
  if (currentAction) { currentAction.fadeOut(0.2); currentAction = null }
  setActive('stop')
}

document.getElementById('btn-walk').onclick = () => play('walk')
document.getElementById('btn-run').onclick = () => play('run')
document.getElementById('btn-stop').onclick = stop

document.getElementById('chk-skeleton').onchange = (e) => {
  if (skeletonHelper) skeletonHelper.visible = e.target.checked
}

// Derive walk/run URLs from the model URL
// e.g. /models/bandit-runner-rigged.glb -> /models/bandit-runner-walk.glb
const basePath = modelUrl.replace(/-rigged\.glb$/, '').replace(/\.glb$/, '')
const walkUrl = basePath + '-walk.glb'
const runUrl = basePath + '-run.glb'

async function loadGlb(url) {
  return new Promise((resolve, reject) => {
    loader.load(url, resolve, undefined, reject)
  })
}

async function tryLoadGlb(url) {
  try { return await loadGlb(url) } catch { return null }
}

async function init() {
  const info = document.getElementById('info')

  const baseGltf = await loadGlb(modelUrl)
  const model = baseGltf.scene
  scene.add(model)

  // Fit camera to model
  const box = new THREE.Box3().setFromObject(model)
  const center = box.getCenter(new THREE.Vector3())
  const size = box.getSize(new THREE.Vector3())
  const maxDim = Math.max(size.x, size.y, size.z)
  camera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 0.5, center.z + maxDim * 1.5)
  controls.target.copy(center)
  controls.update()

  // Find skeleton
  let skeleton = null
  model.traverse(child => {
    if (child.isSkinnedMesh && child.skeleton && !skeleton) skeleton = child.skeleton
  })

  if (skeleton) {
    skeletonHelper = new SkeletonHelper(model)
    skeletonHelper.visible = document.getElementById('chk-skeleton').checked
    scene.add(skeletonHelper)
  }

  // Load animation clips
  const clips = []
  const [walkGltf, runGltf] = await Promise.all([tryLoadGlb(walkUrl), tryLoadGlb(runUrl)])

  if (walkGltf?.animations?.length) {
    const clip = walkGltf.animations[0].clone()
    clip.name = 'walk'
    clips.push(clip)
  }
  if (runGltf?.animations?.length) {
    const clip = runGltf.animations[0].clone()
    clip.name = 'run'
    clips.push(clip)
  }

  // Set up mixer
  const animNames = clips.map(c => c.name)
  if (clips.length > 0) {
    mixer = new THREE.AnimationMixer(model)
    for (const clip of clips) {
      actions[clip.name] = mixer.clipAction(clip)
    }
    play(animNames.includes('walk') ? 'walk' : animNames[0])
  }

  const boneCount = skeleton ? skeleton.bones.length : 0
  info.textContent = `Bones: ${boneCount}\nClips: ${animNames.length ? animNames.join(', ') : 'none'}`

  if (skeleton) {
    const boneNames = skeleton.bones.map(b => b.name).join(', ')
    console.log(`[skeleton] ${boneCount} bones: ${boneNames}`)
  }
}

init().catch(e => {
  document.getElementById('info').textContent = `Error: ${e.message}`
  console.error(e)
})

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

function animate() {
  requestAnimationFrame(animate)
  const delta = clock.getDelta()
  if (mixer) mixer.update(delta)
  controls.update()
  renderer.render(scene, camera)
}
animate()
</script>
</body>
</html>
